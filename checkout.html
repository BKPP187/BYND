<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f4">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>给喜欢，留个位置 · BYND</title>
  <link rel="stylesheet" href="assets/website/shop.css">
  <link rel="stylesheet" href="assets/website/distribution.css">
  <link rel="stylesheet" href="assets/contact/payment.css">
  <script src="assets/website/distribution-api.js" defer></script>
  <script src="assets/contact/checkout.js" defer></script>
</head>
<body class="distribution-page payment-page">
  <header class="site-header">
    <a class="wordmark" href="shop.html" aria-label="BYND 首页">BYND<span class="wordmark-star">✳</span></a>
    <a href="account.html">我的账号 ↗</a>
  </header>
  <main class="payment-main">
    <section class="payment-art" aria-label="BYND QQ 联系二维码">
      <img src="assets/contact/bynd-payment-frame-e4a9f7ba69a0.webp" width="900" height="1125" alt="奶油粉色的复古 BYND 小窗口，点缀蝴蝶结、爱心与探出脑袋的小狗。" fetchpriority="high" decoding="async">
      <div class="payment-slot qq-slot">
        <a class="qq-code" href="assets/contact/bynd-qq-contact-ca44cdaaaaa9.png" target="_blank" rel="noopener noreferrer" aria-label="放大 QQ 好友二维码">
          <img src="assets/contact/bynd-qq-contact-ca44cdaaaaa9.png" width="1253" height="2272" alt="QQ 3648068162 的好友二维码，点击查看原图">
        </a>
      </div>
    </section>
    <section class="payment-summary" aria-labelledby="payment-title">
      <p class="eyebrow">A LITTLE SOMETHING FOR YOU</p>
      <h1 id="payment-title">来 QQ 找我吧。</h1>
      <p class="payment-subtitle">一次购买 · 永久授权 · BYOK</p>
      <div class="payment-price"><span>正式版价格</span><strong><small>¥</small>13.88</strong></div>
      <p class="qq-intro">扫一扫加好友，或复制 QQ 号搜索。<br>购买与授权的事，我们在 QQ 聊。</p>
      <label class="qq-label" for="qq-number">QQ · 不熬夜啦～</label>
      <div class="qq-contact-row"><input id="qq-number" value="3648068162" readonly inputmode="numeric" aria-label="QQ 号码"><button id="qq-copy" class="green-button" type="button">复制 QQ 号</button></div>
      <p id="qq-status" class="muted payment-note" role="status" aria-live="polite">扫码仅用于添加好友。</p>
      <p class="muted">已购买？<a class="payment-account-link" href="account.html">在账号里查看激活码</a></p>
      <details><summary>之后怎样领取？</summary><p>添加 QQ 后确认购买与交付方式。已有激活码和领取链接仍可照常使用；扫码加好友不会自动扣款或发放激活码。模型 API 的使用费用由模型服务商另行收取。</p></details>
      <a class="payment-back" href="shop.html#get">← 回到购买与下载</a>
    </section>
  </main>
</body>
</html>
