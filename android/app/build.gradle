plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Sale and update services are deliberately opt-in, independently of debug/release.
def requireLicense = providers.gradleProperty('byndRequireLicense').orElse('false').get()
def enableUpdates = providers.gradleProperty('byndEnableUpdates').orElse('false').get()
if (!(requireLicense in ['true', 'false']) || !(enableUpdates in ['true', 'false'])) {
    throw new GradleException('BYND distribution switches must be true or false')
}
def publicKeysPath = providers.gradleProperty('byndPublicKeysFile').orElse('').get()
def publicKeys = publicKeysPath ? rootProject.file(publicKeysPath).getText('UTF-8').trim() : '{}'
def parsedPublicKeys = new groovy.json.JsonSlurper().parseText(publicKeys)
if (!(parsedPublicKeys instanceof Map) || !parsedPublicKeys.every { key, value -> key ==~ /[A-Za-z0-9_-]{1,64}/ && value instanceof String && value ==~ /[A-Za-z0-9_-]+/ }) {
    throw new GradleException('BYND public keys must map key ids to base64url SPKI values')
}
try {
    parsedPublicKeys.each { key, value ->
        def decoded = java.util.Base64.urlDecoder.decode(value)
        def publicKey = java.security.KeyFactory.getInstance('RSA').generatePublic(new java.security.spec.X509EncodedKeySpec(decoded))
        if (publicKey.modulus.bitLength() < 2048) throw new IllegalArgumentException('RSA public key is too short')
    }
} catch (Exception error) {
    throw new GradleException('BYND keys must contain public RSA SPKI keys only; never pass a private JWK', error)
}
if ((requireLicense == 'true' || enableUpdates == 'true') && parsedPublicKeys.isEmpty()) {
    throw new GradleException('Pin public keys before enabling BYND licensing or updates')
}
def serviceUrl = providers.gradleProperty('byndServiceUrl').orElse('https://bynd.ccwu.cc').get().replaceAll('/+$', '')
def serviceUri = new URI(serviceUrl)
if (serviceUri.scheme != 'https' || !serviceUri.host || serviceUri.userInfo || serviceUri.rawQuery || serviceUri.rawFragment || serviceUri.path) {
    throw new GradleException('BYND service URL must be an HTTPS origin')
}
def apkHosts = providers.gradleProperty('byndApkHosts').orElse('bynd.ccwu.cc').get()
def javaString = { value -> groovy.json.JsonOutput.toJson(value) }

android {
    namespace 'cc.ccwu.bynd'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'cc.ccwu.bynd'
        minSdk 23
        targetSdk 28
        versionCode 441
        versionName '1.1.1016'
        buildConfigField 'boolean', 'BYND_REQUIRE_LICENSE', requireLicense
        buildConfigField 'boolean', 'BYND_ENABLE_UPDATES', enableUpdates
        buildConfigField 'String', 'BYND_PUBLIC_KEYS', javaString(publicKeys)
        buildConfigField 'String', 'BYND_SERVICE_URL', javaString(serviceUrl)
        buildConfigField 'String', 'BYND_APK_HOSTS', javaString(apkHosts)
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storeType keystoreProps.getProperty('storeType', 'PKCS12')
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // 侧载分发不上 Google Play，targetSdk 28 是有意保留的运行时行为
        disable 'ExpiredTargetSdkVersion'
    }

    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/assets"]
        }
    }
}

tasks.register('assembleWebSources', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/assemble-sources.cjs'
}

// An Exec task without outputs also runs when Sync itself is up-to-date. Changes
// to excluded originals must still fail if their retained mirror becomes stale.
tasks.register('verifyAndroidAssetMirrors', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/check-android-asset-dedup.cjs'
}

tasks.register('syncWebAssets', Sync) {
    dependsOn assembleWebSources, verifyAndroidAssetMirrors
    from(rootProject.projectDir.parentFile) {
        include '*.html'
        include '*.js'
        include '*.css'
        include '*.svg'
        include '*.png'
        include '*.webmanifest'
        include 'assets/**'
        exclude 'shop.html'
        exclude 'license-admin.html'
        exclude 'license-receipt.html'
        exclude 'checkout.html'
        exclude 'account.html'
        exclude 'assets/website/**'
        // file:// home models use classic-script mirrors; APK background removal
        // uses XHR and keeps the original bytes. Never ship both representations.
        exclude 'assets/home3d/**/*.glb'
        // These six portraits are already embedded in the initial portrait scripts.
        exclude 'assets/home3d/characters/default-user-v1.png'
        exclude 'assets/home3d/characters/default-char-v1.png'
        exclude 'assets/home3d/characters/default-user-sleep-v1.png'
        exclude 'assets/home3d/characters/default-char-sleep-v1.png'
        exclude 'assets/home3d/characters/model-user-preview-v1.png'
        exclude 'assets/home3d/characters/model-char-preview-v1.png'
        exclude 'assets/vendor/pet-background/*.wasm.js'
        exclude 'assets/vendor/pet-background/*.onnx.js'
        exclude 'assets/vendor/pet-background/*.mjs.js'
        exclude 'apps/monitor/pet-background-worker.js.js'
        include 'apps/**'
        include 'core/**'
        include 'systems/**'
        include 'ui/**'
        exclude 'script.js'
        exclude 'wechat.js'
        exclude 'style.css'
        exclude 'apps/settings/settings.js'
        exclude '**/*.part.js'
        include '表情包/**'
        exclude 'android/**'
        exclude '.git/**'
        exclude '.github/**'
        exclude '.wrangler/**'
    }
    into "$buildDir/generated/assets/www"
    doLast {
        exec {
            workingDir rootProject.projectDir.parentFile
            commandLine 'node', 'scripts/check-android-asset-dedup.cjs', "$buildDir/generated/assets/www"
        }
    }
}

preBuild.dependsOn syncWebAssets
