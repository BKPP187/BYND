name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'modules/**'
      - 'styles/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
      - 'manifest.webmanifest'
      - 'bynd-icon.svg'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test web application
        run: node tests/run.cjs

      - name: Read app version
        id: app_version
        run: |
          version=$(node -p "require('./scripts/bump-version.cjs').currentVersion()")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner's sdkmanager no longer offers the retired 'tools' package; Gradle fetches the rest.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          gradle -p android :app:assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BYND-v${{ steps.app_version.outputs.version }}-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYND-v${{ steps.app_version.outputs.version }}-debug
          path: android/app/build/outputs/apk/debug/BYND-v${{ steps.app_version.outputs.version }}-debug.apk

      - name: Prepare release keystore
        run: |
          echo "$BYND_KEYSTORE_BASE64" | base64 -d > android/bynd-release.keystore
          {
            echo "storeFile=bynd-release.keystore"
            echo "storeType=PKCS12"
            echo "storePassword=$BYND_KEYSTORE_PASSWORD"
            echo "keyAlias=bynd"
            echo "keyPassword=$BYND_KEYSTORE_PASSWORD"
          } > android/keystore.properties
        env:
          BYND_KEYSTORE_BASE64: ${{ secrets.BYND_KEYSTORE_BASE64 }}
          BYND_KEYSTORE_PASSWORD: ${{ secrets.BYND_KEYSTORE_PASSWORD }}

      - name: Build signed release APK
        run: |
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/BYND-v${{ steps.app_version.outputs.version }}.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BYND-v${{ steps.app_version.outputs.version }}
          path: android/app/build/outputs/apk/release/BYND-v${{ steps.app_version.outputs.version }}.apk
